<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This career signal has moved. Return to Career Copilot." />
    <title>Signal not found | Career Copilot</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #10120f; color: #f3f0e8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      main { width: min(720px, 100%); border-top: 2px solid #c8ff52; padding-top: 24px; }
      p { max-width: 460px; color: #b6b8ad; font-size: 18px; line-height: 1.55; }
      h1 { max-width: 620px; margin: 42px 0 0; font-size: clamp(52px, 10vw, 112px); line-height: .88; letter-spacing: -.08em; }
      a { display: inline-flex; margin-top: 28px; padding: 14px 18px; background: #c8ff52; color: #10120f; text-decoration: none; font-weight: 700; }
      a:hover { transform: translateX(6px); }
      a:focus-visible { outline: 2px solid #ff7b5c; outline-offset: 4px; }
      .signal { display: inline-block; margin-bottom: 18px; color: #ff7b5c; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <span class="signal">Signal lost / 404</span>
      <h1>This route is no longer in the map.</h1>
      <p>The page you followed has moved. Return to the copilot and keep building a clearer next step.</p>
      <a href="/">Return to Career Copilot</a>

  </body>
